# BukaKios WebView Simple — Docker Compose (Dev)
# Mode DEVELOPMENT LOKAL: source code di-mount dari host → edit PHP langsung kebaca
# tanpa rebuild. Hanya untuk dev, JANGAN dipakai di live.
#
# Live/Production tetap memakai docker-compose.yml (source di-bake ke image).
#
# Usage:
#   Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Live: docker compose -f docker-compose.yml up -d --build
#
services:
  app:
    # Override: jangan build ulang, pakai image yang sudah di-build
    build: ~
    image: wv-simple:latest
    container_name: wv-simple
    restart: unless-stopped
    ports:
      - "127.0.0.1:1001:80"
    env_file:
      - .env
    volumes:
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./.env:/var/www/html/.env:ro
      # DEV ONLY: mount seluruh source code dari host → auto-uupdate tanpa rebuild.
      # Hapus baris ini di production (pakai docker-compose.yml saja).
      - .:/var/www/html:ro