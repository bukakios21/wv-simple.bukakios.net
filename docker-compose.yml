services:

  # ─────────────────────────────────────────────
  # BukaKios WebView Simple
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wv-simple
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    ports:
      - "127.0.0.1:1001:80"
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
