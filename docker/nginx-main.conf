# BukaKios WebView Simple - Nginx main config
# Override default Alpine nginx.conf untuk set user non-root
# agar Nginx worker bisa akses PHP-FPM Unix socket.

# user directive HARUS di main (atau http) context, tidak boleh di server block.
user appuser;

worker_processes auto;
worker_cpu_affinity auto;
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    types_hash_max_size 2048;

    # Buffer & timeout
    client_max_body_size 16m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # FastCGI buffer global
    fastcgi_buffer_size 16k;
    fastcgi_buffers 8 16k;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    # Include server blocks dari /etc/nginx/http.d/*.conf
    include /etc/nginx/http.d/*.conf;
}
