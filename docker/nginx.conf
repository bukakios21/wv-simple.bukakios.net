server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Disable absolute redirect so Location header uses relative path
    # This prevents Nginx from dropping the port in redirects
    absolute_redirect off;

    # Log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ─────────────────────────────────────────────
    # Cache static assets (CSS, JS, images, fonts)
    # ─────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─────────────────────────────────────────────
    # Serve route folders (tagihan-internet, beli-lagi, dll)
    # Jika file/folder ada langsung, serve. Fallback ke index.php
    # ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Handle PHP
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Blok akses ke file tersembunyi
    location ~ /\. {
        deny all;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
